name: PR compliance gate

on:
  pull_request:

permissions:
  contents: read

jobs:
  coverage-delta:
    name: Docstring coverage delta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # build: false downloads the adacovex release binary. `build: true` is
      # only valid when the checked-out repository IS adacovex (self-assessment);
      # in a consumer workspace it would just `alr build` this project and no
      # `bin/adacovex` would be produced.
      - uses: bladeacer/adacovex@v1
        with:
          target: .
          dal: C
          gnat-version: 15.2.1
          build: false
          coverage-delta: ${{ github.event.pull_request.base.sha }}
