name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  assessment:
    name: SPARK proof + assessment (DAL-C)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # build: false downloads the adacovex release binary. `build: true` is
      # only valid when the checked-out repository IS adacovex (self-assessment);
      # in a consumer workspace it would just `alr build` this project and no
      # `bin/adacovex` would be produced.
      - uses: bladeacer/adacovex@v1
        with:
          target: .
          dal: C
          gnat-version: 15.2.1
          build: false
          prove: true

  native-tests:
    name: Build + native test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: alire-project/setup-alire@latest
        with:
          version: '2.1.1'
          toolchain: 'gnat_native=15.2.1 gprbuild'
      - name: Build
        run: alr build
      - name: Run test suite
        run: ./test_crdt
