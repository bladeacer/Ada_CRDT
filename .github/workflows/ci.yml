name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  assessment:
    name: SPARK proof + assessment (DAL-C)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bladeacer/adacovex@v1
        with:
          target: .
          dal: C
          gnat-version: 15.2.1
          build: true
          prove: true

  native-tests:
    name: Build + native test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bladeacer/adacovex@v1
        with:
          target: .
          dal: C
          gnat-version: 15.2.1
          build: true
          run-tests: true
          assess: false
