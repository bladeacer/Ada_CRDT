# Development manifest for local SPARK proof, doc generation, formatting, and
# adacovex tooling. Used exclusively by `make prove`, `make doc`, `make fmt`,
# `make coverage-gate`, `make badges`, and `make sbom`, which temporarily swap
# this manifest over alire.toml for the duration of the command and restore the
# clean publishing manifest afterwards.
#
# This manifest includes gnatprove, gnatdoc_bin, gnatformat_bin, and covex
# (adacovex) which are required for the dev targets above but MUST NOT appear
# in the published Alire community index (they are build tools, not library
# dependencies). Only the clean alire.toml is published.
#
# covex is declared as a normal index dependency (covex = "*"); it is NOT pinned
# to a local path. A path pin such as `{ path = "../adacovex" }` resolves only
# on a machine that has the sibling checkout, so `alr build` and adacovex's
# `prove` subcommand (which run `alr exec -- gnatprove` against this manifest)
# would fail in any consumer workspace or on CI. Use the published crate.
name = "crdt"
description = "CRDT library for Ada/SPARK"
long-description = """
CRDT (Conflict-Free Replicated Data Types) library for Ada/SPARK with SPARK
Gold formal verification and DO-178C DAL-C targeting.

PN-Counters, LWW-Element-Sets, LWW-Clocked-Sets (generic over Lamport, Vector,
or Matrix clock strategies), and RGA sequences with three backend engines
(Yjs chunk-based, Naive flat list, Fugue anti-interleaving BST). State-based
(CvRDT delta sync) and operation-based (CmRDT bounded op log) sync layers.
Hybrid Logical Clock (HLC), versioned wire protocol (V1/V2/V3) with LEB128
encoding, and thread-safe protected wrappers.

Zero heap allocation -- all containers use pre-allocated bounded storage.
Core packages SPARK-proven at Gold level (absence of runtime errors).
"""
version = "1.9.0"

authors = ["bladeacer"]
maintainers = ["bladeacer <wg.nick.exe@gmail.com>"]
maintainers-logins = ["bladeacer"]
licenses = "MIT"
website = "https://github.com/bladeacer/ada_crdt"
tags = ["crdt", "spark", "ada"]

executables = ["test_crdt"]

[[depends-on]]
gnatprove = "^15.1.0"
gnatdoc_bin = "^26.0.0"
gnatformat_bin = "^26.0.0"
covex = "*"