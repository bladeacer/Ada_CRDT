# Development manifest for local SPARK proof, doc generation, and formatting.
# Copy this over alire.toml during development:
#   make dev-setup
# Restore the clean publishing manifest with:
#   make prod-setup
#
# This manifest includes gnatprove, gnatdoc_bin, and gnatformat_bin which are
# required for `make prove`, `make doc`, and `make fmt` but MUST NOT appear in
# the published Alire community index (they are build tools, not library
# dependencies).
#
# The clean alire.toml is what gets committed and published.
# Only alire.toml is published to the community index.
name = "crdt"
description = "CRDT library for Ada/SPARK"
version = "1.7.0"

authors = ["bladeacer"]
maintainers = ["bladeacer <wg.nick.exe@gmail.com>"]
maintainers-logins = ["bladeacer"]
licenses = "MIT"
website = "https://github.com/bladeacer/ada_crdt"
tags = ["crdt", "spark", "ada"]

executables = ["test_crdt"]

[[depends-on]]
gnatprove = "^15.1.0"
gnatdoc_bin = "^26.0.0"
gnatformat_bin = "^26.0.0"
